services:
  db:
    image: postgres:17-alpine
    container_name: hacienda_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hacienda_practica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: hacienda_app
    ports:
      - "8899:8899"
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgrespassword
      - PGDATABASE=hacienda_practica
      - HOST=0.0.0.0
      - PORT=8899
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
